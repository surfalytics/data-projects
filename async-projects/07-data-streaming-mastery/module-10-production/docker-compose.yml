services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: module10-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job. Downloads the Prometheus JMX exporter java agent and the
  # config into a shared volume. Kafka loads the agent with KAFKA_OPTS.
  jmx-agent-init:
    image: curlimages/curl:8.5.0
    container_name: module10-jmx-agent-init
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >
        curl -fsSL -o /agent/jmx_prometheus_javaagent.jar
        https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar
        && cp /config/kafka-jmx-config.yml /agent/kafka-jmx-config.yml
    volumes:
      - jmx-agent:/agent
      - ./config/kafka-jmx-config.yml:/config/kafka-jmx-config.yml:ro
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: module10-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
      jmx-agent-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
      - "7071:7071"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - jmx-agent:/opt/jmx-exporter:ro
    # The JMX agent is set only for the broker process. If it were set in the container
    # environment, every "docker exec ... kafka-topics" command would try to start a second
    # agent on port 7071 and crash.
    command:
      - bash
      - -c
      - |
        export KAFKA_OPTS="-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx-exporter/kafka-jmx-config.yml"
        exec /etc/confluent/docker/run
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.47.0
    hostname: prometheus
    container_name: module10-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      kafka:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.1.0
    hostname: grafana
    container_name: module10-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml:ro
      - ./config/kafka-monitoring-dashboard.json:/var/lib/grafana/dashboards/kafka-monitoring.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: module10-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: module10-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_JMXPORT: 9101
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  jmx-agent:
  prometheus-data:
  grafana-data:
