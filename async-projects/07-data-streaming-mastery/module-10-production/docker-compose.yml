services:
  # One-shot job. Downloads the Prometheus JMX exporter java agent and the
  # config into a shared volume. The broker loads the agent with KAFKA_OPTS (set only for the broker process).
  jmx-agent-init:
    image: curlimages/curl:8.5.0
    container_name: module10-jmx-agent-init
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >
        curl -fsSL -o /agent/jmx_prometheus_javaagent.jar
        https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar
        && cp /config/kafka-jmx-config.yml /agent/kafka-jmx-config.yml
    volumes:
      - jmx-agent:/agent
      - ./config/kafka-jmx-config.yml:/config/kafka-jmx-config.yml:ro
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:8.4.1
    hostname: kafka
    container_name: module10-kafka
    depends_on:
      jmx-agent-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
      - "7071:7071"
    environment:
      # KRaft: one node is both broker and controller. No ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - jmx-agent:/opt/jmx-exporter:ro
    # The JMX agent is set only for the broker process. If it were set in the container
    # environment, every "docker exec ... kafka-topics" command would try to start a second
    # agent on port 7071 and crash.
    command:
      - bash
      - -c
      - |
        export KAFKA_OPTS="-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx-exporter/kafka-jmx-config.yml"
        exec /etc/confluent/docker/run
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0
    hostname: prometheus
    container_name: module10-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.6
    hostname: grafana
    container_name: module10-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml:ro
      - ./config/kafka-monitoring-dashboard.json:/var/lib/grafana/dashboards/kafka-monitoring.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    hostname: kafka-ui
    container_name: module10-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: module10-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider --quiet http://localhost:8080/api/clusters || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  jmx-agent:
  prometheus-data:
  grafana-data:
