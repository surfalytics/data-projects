# Client over the SSL listener (inside the container). The client certificate CN is "kafka-client".
# kafka-client is NOT a super user, so it needs ACLs (use it to test ACLs).
# Here the healthcheck only needs a working TLS handshake. ApiVersions needs no ACL.
security.protocol=SSL
ssl.keystore.location=/etc/kafka/secrets/kafka.client.keystore.p12
ssl.keystore.type=PKCS12
ssl.keystore.password=changeit-demo
ssl.truststore.location=/etc/kafka/secrets/kafka.client.truststore.p12
ssl.truststore.type=PKCS12
ssl.truststore.password=changeit-demo
