global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: "prometheus"

  # Kafka broker metrics (JMX exporter java agent on port 7071)
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:7071"]
        labels:
          instance: "kafka-broker-1"
    scrape_interval: 15s
    metrics_path: /metrics

  # Grafana metrics
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          instance: "grafana"
    metrics_path: /metrics
