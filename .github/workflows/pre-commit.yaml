name: Run Pre-commit Hooks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so we can compare with main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      # Check only files that were added or changed compared to main.
      # Deleted files are skipped (--diff-filter=d).
      - name: Run pre-commit on changed files
        run: |
          git fetch origin main
          files=$(git diff --name-only --diff-filter=d origin/main...HEAD)
          if [ -n "$files" ]; then
            pre-commit run --show-diff-on-failure --files $files
          else
            echo "No changed files to check."
          fi
